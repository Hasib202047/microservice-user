server:
  port: 8082


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    refresh:
      enable: true
    service-url:
      defaultZone: http://localhost:8081/eureka
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
